name: LYNX Imager CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:ui-constraints
      - run: npm run check:ui-scale
      - run: npm run typecheck
      - run: npm run test:imager
      - run: npm run check:input-safety
      - run: npx vite build
